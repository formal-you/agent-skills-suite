name: Feature request
description: Propose a new skill, gate check or installation path
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: "What cannot be done today, and who is affected?"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: "Skill, flag, template or workflow you propose; keep it prompt-first and optional-script friendly"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: "This keeps every step usable without Python"
          required: true
        - label: "This does not weaken Gate 1 or role isolation"
          required: true
