name: Quality Engineering Gate

# Master CI Quality Gate Workflow Template
# Maintained by the quality-engineering skill for building CI pipelines, configuring
# test environments, and managing pre-merge and post-merge automated verification:
#   1. BDD Executable Specifications & Contract Validation (Gate 1 - plan_linter.py)
#   2. Cyclomatic Complexity (McCabe V(G) <= 10) & Basis Path Testing
#   3. Mutation Testing & MSI Kill Ratio Audit (MSI >= 80% - Gate 3 verification_linter.py)
#   4. Authoritative Role Separation & RBAC Audit (tools/rbac_audit.py)
#   5. Acceptance Test Suite Execution (tests/acceptance/**)
#
# Copy this file to .github/workflows/quality-gate.yml in the adopting repository.
# See templates/ci/README.md for installation, configuration, and troubleshooting.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1: Gate 1 Plan Linter & BDD Contract Validation
  # Checks: 01-contract format, YAML frontmatter, BDD Given-When-Then scenarios,
  #         Goldilocks task sizing (50-250 lines, 1-3 files), DAG acyclicity,
  #         spec anchor coverage (#sec-*), zero unresolved placeholders.
  # ---------------------------------------------------------------------------
  gate1-plan-linter:
    name: Gate 1 - BDD & Plan Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Gate 1 Plan Linter
        shell: bash
        run: |
          set -uo pipefail
          status=0
          if [ -d "tasks" ]; then
            spec_arg=""
            if [ -f ".specs/02-tech-spec.md" ]; then
              spec_arg="--spec .specs/02-tech-spec.md"
            fi
            python .agents/skills/plan-linter/scripts/plan_linter.py \
              --tasks-dir tasks \
              $spec_arg \
              --json > plan-lint-report.json 2> plan-lint-error.log || status=$?
          else
            echo '{"status": "skipped", "message": "No tasks directory found"}' > plan-lint-report.json
          fi

          {
            echo "## Gate 1 Plan Linter Report"
            echo ""
            echo '```json'
            if [ -s plan-lint-report.json ]; then
              cat plan-lint-report.json
            else
              cat plan-lint-error.log
            fi
            echo '```'
            echo ""
            if [ "$status" -eq 0 ]; then
              echo "Result: **PASSED**"
            else
              echo "Result: **FAILED** (exit $status)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -s plan-lint-report.json ]; then cat plan-lint-report.json; fi
          if [ -s plan-lint-error.log ]; then cat plan-lint-error.log >&2; fi
          exit "$status"

  # ---------------------------------------------------------------------------
  # Stage 2: RBAC Role Separation Audit (Authoritative L1 Enforcement)
  # Checks: Role write boundaries across PR diff:
  #         Dev never edits tests/acceptance/**; QA never edits src/**;
  #         Planner never edits implementation or tests.
  # ---------------------------------------------------------------------------
  rbac-audit:
    name: RBAC - Role Boundary Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit role permissions across pull request diff
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RBAC_ROLE: ${{ vars.RBAC_ROLE }}
        run: |
          set -uo pipefail
          args=(--base "$BASE_SHA" --head "$HEAD_SHA" --tasks-dir tasks --json)
          if [ -n "${RBAC_ROLE:-}" ]; then
            args+=(--role "$RBAC_ROLE")
          fi
          status=0
          python tools/rbac_audit.py "${args[@]}" > rbac-report.json 2> rbac-error.log || status=$?
          {
            echo "## RBAC Audit Report"
            echo ""
            echo '```json'
            if [ -s rbac-report.json ]; then cat rbac-report.json; else cat rbac-error.log; fi
            echo '```'
            echo ""
            if [ "$status" -eq 0 ]; then
              echo "Result: **PASSED**"
            else
              echo "Result: **FAILED** (exit $status)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -s rbac-report.json ]; then cat rbac-report.json; fi
          if [ -s rbac-error.log ]; then cat rbac-error.log >&2; fi
          exit "$status"

  # ---------------------------------------------------------------------------
  # Stage 3: Cyclomatic Complexity (McCabe) Static Check
  # Checks: Single-function McCabe complexity limits:
  #         V(G) <= 10 (Standard / Approved)
  #         11 <= V(G) <= 15 (Warning / Architectural justification needed)
  #         V(G) > 15 (Critical / Strictly prohibited, block build)
  # ---------------------------------------------------------------------------
  complexity-gate:
    name: Complexity - McCabe V(G) Static Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tree-sitter & Lizard Multi-Language Parsers
        run: |
          python -m pip install --upgrade pip
          pip install "tree-sitter<0.22" tree-sitter-languages lizard

      - name: Inspect Cyclomatic Complexity (Tree-sitter Multi-Language Engine)
        shell: bash
        run: |
          set -uo pipefail
          status=0
          mkdir -p artifacts
          echo "Auditing Cyclomatic Complexity (Tree-sitter multi-language engine, McCabe V(G) <= 10)..."

          python .agents/skills/quality-engineering/scripts/complexity_check.py \
            --json > artifacts/complexity-report.json 2> artifacts/complexity-error.log || status=$?

          {
            echo "## Cyclomatic Complexity (McCabe) Report"
            echo ""
            echo '```json'
            if [ -s artifacts/complexity-report.json ]; then
              cat artifacts/complexity-report.json
            else
              cat artifacts/complexity-error.log
            fi
            echo '```'
            echo ""
            if [ "$status" -eq 0 ]; then
              echo "Result: **PASSED** (all functions meet V(G) <= 15, standard <= 10)"
            else
              echo "Result: **FAILED** (functions detected with critical V(G) > 15)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -s artifacts/complexity-report.json ]; then cat artifacts/complexity-report.json; fi
          if [ -s artifacts/complexity-error.log ]; then cat artifacts/complexity-error.log >&2; fi
          exit "$status"

  # ---------------------------------------------------------------------------
  # Stage 4: Acceptance Test Suite Execution
  # Checks: Executes black-box acceptance tests (tests/acceptance/**) derived
  #         from BDD Given-When-Then scenarios. Requires 100% test pass.
  # ---------------------------------------------------------------------------
  acceptance-tests:
    name: Acceptance - Test Suite Execution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Acceptance Test Suite
        shell: bash
        run: |
          set -uo pipefail
          status=0
          if [ -d "tests/acceptance" ]; then
            echo "Executing acceptance test suite in tests/acceptance..."
            python -m unittest discover -s tests/acceptance -v 2>&1 | tee acceptance-test.log || status=$?
          elif [ -d "tests" ]; then
            echo "Executing unit & acceptance test suite in tests..."
            python -m unittest discover -s tests -v 2>&1 | tee acceptance-test.log || status=$?
          else
            echo "No tests directory found, skipping." | tee acceptance-test.log
          fi

          {
            echo "## Acceptance Test Suite Results"
            echo ""
            echo '```'
            tail -n 25 acceptance-test.log
            echo '```'
            echo ""
            if [ "$status" -eq 0 ]; then
              echo "Result: **PASSED** (100% green baseline)"
            else
              echo "Result: **FAILED** (exit $status)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # ---------------------------------------------------------------------------
  # Stage 5: Gate 3 Verification Linter & Mutation Score Audit
  # Checks: Audits 03-qa-verification.md when signed off with QA_PASSED:
  #         - Basis Path Test Cases >= V(G) for modified functions
  #         - Mutation Testing table completeness & MSI >= 80% (MSI >= 90% core)
  #         - Zero survived mutants in critical business modules
  # ---------------------------------------------------------------------------
  gate3-verification:
    name: Gate 3 - Acceptance & MSI Audit
    runs-on: ubuntu-latest
    needs: [gate1-plan-linter, rbac-audit, complexity-gate, acceptance-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Gate 3 Verification Linter
        shell: bash
        run: |
          set -uo pipefail
          status=0
          if [ -d "tasks" ]; then
            python .agents/skills/quality-engineering/scripts/verification_linter.py \
              --tasks-dir tasks \
              --json > verification-report.json 2> verification-error.log || status=$?
          else
            echo '{"status": "skipped", "message": "No tasks directory found"}' > verification-report.json
          fi

          {
            echo "## Gate 3 Verification & MSI Audit Report"
            echo ""
            echo '```json'
            if [ -s verification-report.json ]; then
              cat verification-report.json
            else
              cat verification-error.log
            fi
            echo '```'
            echo ""
            if [ "$status" -eq 0 ]; then
              echo "Result: **PASSED** (Basis paths >= V(G) and MSI >= 80% confirmed)"
            else
              echo "Result: **FAILED** (exit $status)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -s verification-report.json ]; then cat verification-report.json; fi
          if [ -s verification-error.log ]; then cat verification-error.log >&2; fi
          exit "$status"

  # ---------------------------------------------------------------------------
  # Stage 6 (Optional): Automated Mutation Testing Execution
  # Demonstrates active mutant execution and kill ratio threshold verification.
  # Can run on scheduled runs or release branches to prevent excessive PR delay.
  # ---------------------------------------------------------------------------
  mutation-active-check:
    name: Mutation - Active Kill Ratio Check
    runs-on: ubuntu-latest
    needs: [acceptance-tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Active Mutation Testing (Python example with mutmut)
        shell: bash
        run: |
          echo "Running active mutation testing baseline..."
          # Install mutation runner (adapt to your stack: mutmut, stryker, etc.)
          pip install mutmut || true
          if command -v mutmut >/dev/null 2>&1 && [ -d "src" ]; then
            mutmut run --paths-to-mutate src/ || true
            mutmut results || true
          else
            echo "mutmut not available or src/ directory absent; relying on Gate 3 verification linter audit."
          fi
